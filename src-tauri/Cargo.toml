[package]
name = "bitchord-lite"
version = "0.1.0"
description = "Lightweight YouTube Music player for macOS"
authors = ["sigidpam"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
